<div id="win">
  <div id="bar"><span>Générateur de clés</span><span aria-hidden="true">⋮⋮</span></div>
  <div class="in">
    <p class="sub">Entrez des dates <b>PERTINENTES</b> au format jj/mm/aaaa (ou 2 fois la même) ou un code à tester (2 fois le même).</p>
    <label for="d1">Date 1 / Code à tester</label>
    <input id="d1" placeholder="15/10/2012" maxlength="20" autocomplete="off">
    <label for="d2">Date 2 / Code à tester</label>

    <button id="go">Générer la clé</button>

<script>
// À REMPLACER par l'adresse de votre Worker Cloudflare
var WORKER_URL = "https://cle-generator.parisis-titi.workers.dev";
var $=function(i){return document.getElementById(i);};
var win=$('win'),bar=$('bar');

function formeDate(s){return /^\d{2}\/\d{2}\/\d{4}$/.test(s);}
function dateValide(s){
  var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);if(!m)return false;
  var j=+m[1],mo=+m[2],a=+m[3],d=new Date(a,mo-1,j);
  return d.getFullYear()===a&&d.getMonth()===mo-1&&d.getDate()===j;
}
// Ajoute les « / » seulement quand on tape une date (plus de 4 chiffres) ; un code court reste intact
function autoSlash(e){
  var v=e.target.value;
  if(!/^[\d\/]*$/.test(v))return;
  var d=v.replace(/\//g,'');
  if(d.length<=4)return;
  d=d.slice(0,8);
  e.target.value=d.slice(0,2)+'/'+d.slice(2,4)+(d.length>4?'/'+d.slice(4):'');
}
async function calc(){
  var err=$('err'),res=$('res'),go=$('go');
  err.textContent='';res.style.display='none';
  var d1=$('d1').value.trim(),d2=$('d2').value.trim();
  if(!d1||!d2){err.textContent='Remplissez les deux champs.';return;}
  if((formeDate(d1)&&!dateValide(d1))||(formeDate(d2)&&!dateValide(d2))){err.textContent='Date invalide : vérifiez le jour et le mois.';return;}
  go.disabled=true;
  try{
    var r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d1:d1,d2:d2})});
    var data=await r.json();
    if(!r.ok||!data.cle){err.textContent=data.erreur||'Erreur du serveur.';}
    else{$('code').textContent=data.cle;res.style.display='block';}
  }catch(e){err.textContent='Impossible de joindre le serveur.';}
  go.disabled=false;
  place(win.offsetLeft,win.offsetTop);
}
['d1','d2'].forEach(function(id){
  var el=$(id);
  el.addEventListener('input',autoSlash);
  el.addEventListener('keydown',function(e){if(e.key==='Enter'){id==='d1'?$('d2').focus():calc();}});
});
$('go').addEventListener('click',calc);
$('cp').addEventListener('click',function(){
  var btn=this,t=$('code').textContent;
  function ok(){btn.textContent='Copié ✓';setTimeout(function(){btn.textContent='Copier la clé';},1500);}
  function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(e){btn.textContent='Copie impossible';}document.body.removeChild(ta);}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb);}else fb();}catch(e){fb();}
});

// Fenêtre déplaçable (souris et tactile), gardée dans l'écran
function place(x,y){
  var m=8;
  x=Math.max(m,Math.min(x,innerWidth-win.offsetWidth-m));
  y=Math.max(m,Math.min(y,innerHeight-win.offsetHeight-m));
  win.style.left=x+'px';win.style.top=y+'px';
}
var drag=false,ox=0,oy=0;
bar.addEventListener('pointerdown',function(e){
  drag=true;ox=e.clientX-win.offsetLeft;oy=e.clientY-win.offsetTop;bar.setPointerCapture(e.pointerId);
});
bar.addEventListener('pointermove',function(e){if(drag)place(e.clientX-ox,e.clientY-oy);});
bar.addEventListener('pointerup',function(){drag=false;});
bar.addEventListener('pointercancel',function(){drag=false;});
window.addEventListener('resize',function(){place(win.offsetLeft,win.offsetTop);});
place((innerWidth-win.offsetWidth)/2,innerHeight*0.14);
</script>
